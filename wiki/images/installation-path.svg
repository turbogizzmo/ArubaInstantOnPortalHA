<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title">
  <title id="title">HACS installation sequence</title>
  <rect width="1000" height="300" rx="24" fill="#f5f7fb"/>
  <style>.b{fill:#fff;stroke:#5b6b8c;stroke-width:2}.n{fill:#2b6cb0}.t{font:700 18px sans-serif;fill:#172b4d}.s{font:15px sans-serif;fill:#42526e}.a{stroke:#00a3a3;stroke-width:4;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00a3a3"/></marker></defs>
  <g transform="translate(30 70)"><rect class="b" width="170" height="150" rx="16"/><circle class="n" cx="30" cy="30" r="18"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif">1</text><text class="t" x="85" y="70" text-anchor="middle">Add repository</text><text class="s" x="85" y="100" text-anchor="middle">HACS custom</text></g>
  <g transform="translate(230 70)"><rect class="b" width="170" height="150" rx="16"/><circle class="n" cx="30" cy="30" r="18"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif">2</text><text class="t" x="85" y="70" text-anchor="middle">Download</text><text class="s" x="85" y="100" text-anchor="middle">Latest release</text></g>
  <g transform="translate(430 70)"><rect class="b" width="170" height="150" rx="16"/><circle class="n" cx="30" cy="30" r="18"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif">3</text><text class="t" x="85" y="70" text-anchor="middle">Restart</text><text class="s" x="85" y="100" text-anchor="middle">Home Assistant</text></g>
  <g transform="translate(630 70)"><rect class="b" width="170" height="150" rx="16"/><circle class="n" cx="30" cy="30" r="18"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif">4</text><text class="t" x="85" y="70" text-anchor="middle">Add integration</text><text class="s" x="85" y="100" text-anchor="middle">Devices &amp; services</text></g>
  <g transform="translate(830 70)"><rect class="b" width="140" height="150" rx="16"/><circle class="n" cx="30" cy="30" r="18"/><text x="30" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif">5</text><text class="t" x="70" y="70" text-anchor="middle">Configure</text><text class="s" x="70" y="100" text-anchor="middle">Site account</text></g>
</svg>
