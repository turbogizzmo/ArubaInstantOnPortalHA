<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title">
  <title id="title">Configuration validation flow</title>
  <rect width="1000" height="420" rx="24" fill="#f5f7fb"/>
  <style>.b{fill:#fff;stroke:#2b6cb0;stroke-width:2}.t{font:700 18px sans-serif;fill:#172b4d}.s{font:15px sans-serif;fill:#42526e}.a{stroke:#00a3a3;stroke-width:4;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00a3a3"/></marker></defs>
  <rect class="b" x="60" y="130" width="170" height="120" rx="16"/><text class="t" x="145" y="172" text-anchor="middle">Setup form</text><text class="s" x="145" y="202" text-anchor="middle">Account, site ID,</text><text class="s" x="145" y="226" text-anchor="middle">poll interval</text>
  <rect class="b" x="290" y="130" width="170" height="120" rx="16"/><text class="t" x="375" y="172" text-anchor="middle">OAuth + PKCE</text><text class="s" x="375" y="202" text-anchor="middle">Authenticate</text><text class="s" x="375" y="226" text-anchor="middle">securely</text>
  <rect class="b" x="520" y="130" width="170" height="120" rx="16"/><text class="t" x="605" y="172" text-anchor="middle">Validate site</text><text class="s" x="605" y="202" text-anchor="middle">Confirm account</text><text class="s" x="605" y="226" text-anchor="middle">access</text>
  <rect class="b" x="750" y="130" width="190" height="120" rx="16"/><text class="t" x="845" y="172" text-anchor="middle">Create entry</text><text class="s" x="845" y="202" text-anchor="middle">Devices, entities,</text><text class="s" x="845" y="226" text-anchor="middle">coordinator</text>
  <path class="a" d="M230 190H280"/><path class="a" d="M460 190H510"/><path class="a" d="M690 190H740"/>
  <text class="s" x="500" y="330" text-anchor="middle">Failures are reported as authentication or connection errors without exposing credentials.</text>
</svg>
